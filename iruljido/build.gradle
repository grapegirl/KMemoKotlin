plugins { id 'com.android.application' }
android {
    namespace 'momo.kikiplus.com.kbucket'
    compileSdk 37
    defaultConfig {
        applicationId 'momo.kikiplus.com.kbucket'
        minSdk 26
        targetSdk 34
        versionCode 90
        versionName '2.3.2'
    }
    buildTypes { release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'release-rules.pro' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
