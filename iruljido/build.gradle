plugins { id 'com.android.application' }
android {
    namespace 'momo.kikiplus.com.kbucket'
    compileSdk 37
    defaultConfig {
        applicationId 'momo.kikiplus.com.kbucket'
        minSdk 26
        targetSdk 34
        versionCode 91
        versionName '2.3.3'
    }
    buildFeatures { buildConfig = true }
    buildTypes { release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'release-rules.pro' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}

dependencies {
    implementation 'com.kakao.adfit:ads-base:3.23.3'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
}
